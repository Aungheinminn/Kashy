name: Release

# Push a tag like v0.2.0 to build the APK and publish a GitHub Release.
# Run manually from the Actions tab to build without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleRelease -PversionName=${{ needs.version.outputs.name }} -PversionCode=${{ github.run_number }}
      - run: mv app/build/outputs/apk/release/app-release.apk Kashy-${{ needs.version.outputs.name }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Kashy-*-android.apk

  publish:
    if: github.ref_type == 'tag'
    needs: [version, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Kashy ${{ needs.version.outputs.name }}" \
            --notes-file .github/release-notes.md \
            --generate-notes
